  tests:
    profiles: ["test"]
    build:
      context: .
      dockerfile: docker/Dockerfile.tests
    volumes:
      - .:/app
    environment:
      - PYTHONPATH=/app
      - INGEST_URL=http://ingest-api:8000
      - COLLECTOR_API_KEY=${COLLECTOR_API_KEY:-test-collector-key-abc123}
      - TENANT_SECRET=${TENANT_SECRET:-local-tenant-secret-key-32bytes!}
    networks:
      - saas_net
      - customer_net
      - wan_net

# ──────────────────── NETWORKS ──────────────────────────────────────────

networks:
  customer_net:
    internal: true  # NO internet access — proves the trust boundary
  wan_net:
    # The only path out of customer_net
  saas_net:
    # SaaS services communicate here

# ──────────────────── VOLUMES ───────────────────────────────────────────

volumes:
  collector_raw:
    # Raw data store — mounted ONLY into the collector container
    # SaaS containers CANNOT read this. Verifiable via `docker inspect`.
